# Push a tag like v0.2.0 to publish:
#   - ghcr.io/<owner>/glowpod:0.2.0 (amd64 + arm64) with an SBOM and build
#     provenance, signed with cosign;
#   - ghcr.io/<owner>/glowpod-hub:0.2.0, the Hub with K3s inside (docker run),
#     and ghcr.io/<owner>/glowpod-shell:0.2.0, the Hub's browser shell, the
#     same way;
#   - oci://ghcr.io/<owner>/charts/glowpod version 0.2.0, signed with cosign;
#   - a GitHub Release with glowpod downloads for Linux, macOS and Windows,
#     the chart, checksums, an SBOM and build attestations, and notes from
#     CHANGELOG.md;
#   - the version in the classic chart repo, https://glowpod.dev/charts
#     (site/public/charts/index.yaml, pointing at the Release's chart).
# The three images also go to Docker Hub, as docker.io/<namespace>/glowpod and
# so on, with the same digests, tags and signatures, once these are set in the
# repository's Actions settings:
#   - secret DOCKERHUB_TOKEN: a Docker Hub access token that can read and
#     write (and create) the three repositories;
#   - variable DOCKERHUB_USERNAME: the account the token belongs to (for an
#     organization access token, the organization's name);
#   - variable DOCKERHUB_NAMESPACE, optional: where the images go, if not
#     under DOCKERHUB_USERNAME.
# Without them, images go to GHCR only.
# Signing is keyless: signatures are tied to this workflow on this repository
# (see docs/install.md, "Verify what you download").
# A tag with a dash (v0.2.0-rc.1) is a pre-release and doesn't move :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
      image: ${{ steps.v.outputs.image }}
      tags: ${{ steps.v.outputs.tags }}
      hub_image: ${{ steps.v.outputs.hub_image }}
      hub_tags: ${{ steps.v.outputs.hub_tags }}
      shell_image: ${{ steps.v.outputs.shell_image }}
      shell_tags: ${{ steps.v.outputs.shell_tags }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      dockerhub: ${{ steps.v.outputs.dockerhub }}
    steps:
      - id: v
        env:
          DOCKERHUB_READY: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_USERNAME != '' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Image names must be lowercase; GitHub owners needn't be.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/glowpod"
          hub_image="ghcr.io/${owner}/glowpod-hub"
          shell_image="ghcr.io/${owner}/glowpod-shell"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          # The Docker Hub namespace, or empty when Docker Hub isn't set up.
          dockerhub=""
          if [ "$DOCKERHUB_READY" = true ]; then
            dockerhub="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
            dockerhub="${dockerhub,,}"
          fi
          # The version tag, and :latest for a release, on every registry.
          tags_for() {
            local refs=("ghcr.io/${owner}/$1") ref out=()
            if [ -n "$dockerhub" ]; then
              refs+=("docker.io/${dockerhub}/$1")
            fi
            for ref in "${refs[@]}"; do
              out+=("${ref}:${version}")
              if [ "$prerelease" = false ]; then
                out+=("${ref}:latest")
              fi
            done
            local IFS=,
            echo "${out[*]}"
          }
          {
            echo "version=${version}"
            echo "owner=${owner}"
            echo "image=${image}"
            echo "tags=$(tags_for glowpod)"
            echo "hub_image=${hub_image}"
            echo "hub_tags=$(tags_for glowpod-hub)"
            echo "shell_image=${shell_image}"
            echo "shell_tags=$(tags_for glowpod-shell)"
            echo "prerelease=${prerelease}"
            echo "dockerhub=${dockerhub}"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$dockerhub" ]; then
            echo "Images go to GHCR only, because DOCKERHUB_TOKEN or DOCKERHUB_USERNAME isn't set." >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.meta.outputs.dockerhub != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.tags }}
          # An SPDX SBOM and SLSA provenance, stored next to the image.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.meta.outputs.dockerhub }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          if [ -n "$DOCKERHUB" ]; then
            cosign sign --yes "docker.io/${DOCKERHUB}/glowpod@${DIGEST}"
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: needs.meta.outputs.dockerhub != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ needs.meta.outputs.dockerhub }}/glowpod
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  hub-image:
    # The Dockerfile's hub stage: the same binary on K3s.
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.meta.outputs.dockerhub != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: hub
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.hub_tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image
        env:
          IMAGE: ${{ needs.meta.outputs.hub_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.meta.outputs.dockerhub }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          if [ -n "$DOCKERHUB" ]; then
            cosign sign --yes "docker.io/${DOCKERHUB}/glowpod-hub@${DIGEST}"
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.meta.outputs.hub_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: needs.meta.outputs.dockerhub != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ needs.meta.outputs.dockerhub }}/glowpod-hub
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  shell-image:
    # The Dockerfile's shell stage: kubectl and helm for the Hub's browser shell.
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.meta.outputs.dockerhub != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: shell
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.shell_tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the image
        env:
          IMAGE: ${{ needs.meta.outputs.shell_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ needs.meta.outputs.dockerhub }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          if [ -n "$DOCKERHUB" ]; then
            cosign sign --yes "docker.io/${DOCKERHUB}/glowpod-shell@${DIGEST}"
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.meta.outputs.shell_image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - if: needs.meta.outputs.dockerhub != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ needs.meta.outputs.dockerhub }}/glowpod-shell
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    # After the image: the chart points at it.
    needs: [meta, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Package, push and sign the chart
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OWNER: ${{ needs.meta.outputs.owner }}
          IMAGE: ${{ needs.meta.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The published chart points at the image published with it.
          sed -i -E "s#repository: ghcr.io/[^/]+/glowpod#repository: ${IMAGE}#" deploy/helm/glowpod/values.yaml
          grep -q "repository: ${IMAGE}$" deploy/helm/glowpod/values.yaml
          # Artifact Hub: this version's image, changes and pre-release flag.
          python3 -I .github/scripts/chart-annotations.py "$VERSION" "$IMAGE"
          helm package deploy/helm/glowpod --version "$VERSION" --app-version "$VERSION"
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(helm push "glowpod-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
          test -n "$digest"
          echo "$TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${OWNER}/charts/glowpod@${digest}"
      # The same file goes on the GitHub Release for the classic chart repo.
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: glowpod-${{ needs.meta.outputs.version }}.tgz
          if-no-files-found: error

  downloads:
    # Last, so a Release only appears once its images and chart exist.
    needs: [meta, chart, hub-image, shell-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Before dependencies are installed, so dev tooling isn't listed.
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make dist VERSION="$VERSION"
      - run: mv sbom.spdx.json "dist/glowpod_${VERSION}_sbom.spdx.json"
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - run: cd dist && shasum -a 256 "glowpod-${VERSION}.tgz" >> checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/glowpod_*
            dist/glowpod-*.tgz
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.meta.outputs.image }}
          OWNER: ${{ needs.meta.outputs.owner }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          DOCKERHUB: ${{ needs.meta.outputs.dockerhub }}
        run: |
          # This version's CHANGELOG section, then how to install and verify.
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {on=1; next} on && (/^## \[/ || /^\[[^]]*\]: /) {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          cat >> notes.md <<EOF

          ## Install

          - In a cluster: \`helm install glowpod oci://ghcr.io/${OWNER}/charts/glowpod --version ${VERSION} -n glowpod --create-namespace\` ([guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md))
          - Image: \`${IMAGE}:${VERSION}\`${DOCKERHUB:+, or \`${DOCKERHUB}/glowpod:${VERSION}\` on Docker Hub}
          - On your machine: download \`glowpod\` for your platform below.

          Verify the downloads with \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`, and the image with cosign ([how](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md#verify-what-you-download)).
          EOF
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Glowpod ${VERSION}" --notes-file notes.md "${flags[@]}"

  chart-repo:
    # Adds this version to https://glowpod.dev/charts: a commit to main that
    # updates site/public/charts/index.yaml, then a site deploy. Pushes made
    # with GITHUB_TOKEN don't start other workflows, so it starts Site itself.
    needs: [meta, downloads]
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the index
      actions: write # start the Site workflow
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: azure/setup-helm@v5
      - name: Add the version to the index
        run: |
          mkdir new
          gh release download "$GITHUB_REF_NAME" -p "glowpod-${VERSION}.tgz" -D new
          helm repo index new --merge site/public/charts/index.yaml \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mv new/index.yaml site/public/charts/index.yaml
          grep -q "releases/download/${GITHUB_REF_NAME}/glowpod-${VERSION}.tgz" site/public/charts/index.yaml
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/charts/index.yaml
          git commit -m "Chart repo: add glowpod ${VERSION}"
          # main may have moved since the checkout; rebase and retry.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      - run: gh workflow run site.yml --ref main

  packages:
    # Homebrew (macOS, Linux) and Scoop (Windows): rewrites the formula in
    # <owner>/homebrew-tap and the manifest in <owner>/scoop-bucket for this
    # version. Needs the secret PACKAGES_TOKEN, a fine-grained token with
    # Contents: read and write on those two repositories only. Without it, or
    # for a pre-release, this does nothing.
    needs: [meta, downloads]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Token present?
        id: token
        run: echo "ready=${{ secrets.PACKAGES_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: tap
      - if: steps.token.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/scoop-bucket
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: bucket
      - name: Write and push the formula and manifest
        if: steps.token.outputs.ready == 'true'
        run: |
          gh release download "$GITHUB_REF_NAME" -p checksums.txt -D release
          python3 -I .github/scripts/packages.py "$VERSION" "$GITHUB_REPOSITORY" release/checksums.txt tap bucket
          for repo in tap bucket; do
            git -C "$repo" config user.name "github-actions[bot]"
            git -C "$repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$repo" add -A
            git -C "$repo" diff --cached --quiet && continue
            git -C "$repo" commit -m "glowpod ${VERSION}"
            git -C "$repo" push origin HEAD
          done
      - name: Summary
        if: steps.token.outputs.ready != 'true'
        run: echo "Homebrew and Scoop not updated, because the PACKAGES_TOKEN secret isn't set." >> "$GITHUB_STEP_SUMMARY"
